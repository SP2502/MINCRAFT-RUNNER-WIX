<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#101510">

  <title>Creeper Runner</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <!-- top bar -->
    <header class="top">

      <div class="logo">

        <svg
          class="logo-pic"
          viewBox="0 0 48 48"
          aria-hidden="true"
        >
          <rect width="48" height="48" fill="#55a936"/>

          <rect x="8" y="9" width="10" height="10" fill="#111"/>
          <rect x="30" y="9" width="10" height="10" fill="#111"/>

          <rect x="19" y="19" width="10" height="8" fill="#111"/>
          <rect x="13" y="25" width="8" height="13" fill="#111"/>
          <rect x="27" y="25" width="8" height="13" fill="#111"/>
        </svg>

        <div>
          <h1>CREEPER RUNNER</h1>
          <small>OVERWORLD RUN</small>
        </div>

      </div>


      <div class="top-buttons">

        <button
          id="soundBtn"
          class="small-btn"
          title="Sound"
          aria-label="Sound"
        >

          <svg viewBox="0 0 24 24">
            <path
              d="M4 10v4h4l5 4V6l-5 4H4z"
              fill="currentColor"
            />

            <path
              d="M16 9c1 1 1 5 0 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />

          </svg>

        </button>


        <button
          id="pauseBtn"
          class="small-btn"
          title="Pause"
          aria-label="Pause"
        >

          <svg viewBox="0 0 24 24">

            <rect
              x="7"
              y="5"
              width="4"
              height="14"
              fill="currentColor"
            />

            <rect
              x="13"
              y="5"
              width="4"
              height="14"
              fill="currentColor"
            />

          </svg>

        </button>

      </div>

    </header>


    <!-- game -->
    <main>

      <div class="game-box">

        <!-- HUD -->
        <div id="hud" class="hud">

          <div class="hud-piece">
            <span>SCORE</span>
            <b id="score">0</b>
          </div>

          <div class="hud-piece">
            <span>BEST</span>
            <b id="best">0</b>
          </div>

          <div class="hud-piece gems">

            <svg viewBox="0 0 24 24">
              <polygon
                points="12,2 21,9 12,22 3,9"
                fill="#61d65c"
              />
              <polygon
                points="12,2 15,9 12,22 9,9"
                fill="#b4ff9d"
              />
            </svg>

            <b id="gems">0</b>

          </div>


          <div class="mission">

            <div class="mission-top">
              <span>MISSION</span>
              <span id="missionText">0 / 200</span>
            </div>

            <div class="bar">
              <div id="barFill"></div>
            </div>

          </div>

        </div>


        <!-- canvas -->
        <canvas
          id="gameCanvas"
          width="960"
          height="540"
        ></canvas>


        <!-- start -->
        <section
          id="start"
          class="screen"
        >

          <div class="card">

            <svg
              class="big-creeper"
              viewBox="0 0 100 100"
              aria-hidden="true"
            >

              <rect
                width="100"
                height="100"
                fill="#55a936"
              />

              <rect
                x="16"
                y="20"
                width="22"
                height="22"
                fill="#111"
              />

              <rect
                x="62"
                y="20"
                width="22"
                height="22"
                fill="#111"
              />

              <rect
                x="39"
                y="42"
                width="22"
                height="16"
                fill="#111"
              />

              <rect
                x="27"
                y="55"
                width="18"
                height="28"
                fill="#111"
              />

              <rect
                x="55"
                y="55"
                width="18"
                height="28"
                fill="#111"
              />

            </svg>


            <h2>CREEPER<br>RUNNER</h2>

            <p class="tag">
              HOW LONG CAN YOU SURVIVE?
            </p>


            <div class="choose">

              <p>DIFFICULTY</p>

              <div class="levels">

                <button
                  class="level"
                  data-level="easy"
                >
                  EASY
                </button>

                <button
                  class="level active"
                  data-level="medium"
                >
                  NORMAL
                </button>

                <button
                  class="level"
                  data-level="hard"
                >
                  HARD
                </button>

                <button
                  class="level"
                  data-level="veryHard"
                >
                  CRAZY
                </button>

              </div>

            </div>


            <button
              id="startBtn"
              class="start-btn"
            >
              START RUN
            </button>


            <p class="help">
              SPACE / ↑ TO JUMP
            </p>

          </div>

        </section>


        <!-- pause -->
        <section
          id="pause"
          class="screen hide"
        >

          <div class="card small-card">

            <div class="pause-icon">

              <svg viewBox="0 0 24 24">

                <rect
                  x="6"
                  y="4"
                  width="4"
                  height="16"
                  fill="currentColor"
                />

                <rect
                  x="14"
                  y="4"
                  width="4"
                  height="16"
                  fill="currentColor"
                />

              </svg>

            </div>

            <h2>PAUSED</h2>

            <button
              id="resumeBtn"
              class="start-btn"
            >
              CONTINUE
            </button>

            <button
              id="pauseRestartBtn"
              class="other-btn"
            >
              RESTART
            </button>

          </div>

        </section>


        <!-- game over -->
        <section
          id="gameOver"
          class="screen hide"
        >

          <div class="card small-card">

            <div class="dead-icon">
              X
            </div>

            <h2>GAME OVER</h2>

            <p class="message">
              THE CATS GOT YOU.
            </p>


            <div class="stats">

              <div>
                <span>SCORE</span>
                <b id="finalScore">0</b>
              </div>

              <div>
                <span>GEMS</span>
                <b id="finalGems">0</b>
              </div>

              <div>
                <span>BEST</span>
                <b id="finalBest">0</b>
              </div>

            </div>


            <button
              id="againBtn"
              class="start-btn"
            >
              PLAY AGAIN
            </button>

          </div>

        </section>


        <!-- win -->
        <section
          id="win"
          class="screen hide"
        >

          <div class="card small-card">

            <div class="win-icon">

              <svg viewBox="0 0 24 24">

                <polygon
                  points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"
                  fill="currentColor"
                />

              </svg>

            </div>

            <h2>YOU DID IT!</h2>

            <p class="message">
              200 BLOCKS SURVIVED.
            </p>


            <div class="stats">

              <div>
                <span>SCORE</span>
                <b id="winScore">200</b>
              </div>

              <div>
                <span>GEMS</span>
                <b id="winGems">0</b>
              </div>

              <div>
                <span>BEST</span>
                <b id="winBest">200</b>
              </div>

            </div>


            <button
              id="winAgainBtn"
              class="start-btn"
            >
              RUN AGAIN
            </button>

          </div>

        </section>

      </div>


      <!-- phone controls -->
      <div class="phone-controls">

        <button
          id="jumpBtn"
          aria-label="Jump"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M12 19V5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            />

            <path
              d="M6 11l6-6 6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            />

          </svg>

          JUMP

        </button>

      </div>

    </main>


    <!-- footer -->
    <footer>

      <span>CREEPER RUNNER</span>

      <i></i>

      <span>REACH 200 TO WIN</span>

      <i></i>

      <span>v1.0</span>

    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
